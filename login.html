<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · RFQ Itemizer</title>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
    }
  }
  </script>
  <!-- React Bits style login: React 18 UMD + Babel standalone + Tailwind Play CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '"Microsoft JhengHei"', 'Arial', 'sans-serif'] },
          colors: {
            accent: { DEFAULT: '#0d5932', hover: '#0a4728' },
            gold: '#dfbf79',
            ink: '#e8edf2',
            muted: '#8fa0b1',
            panel: '#121c26'
          }
        }
      }
    };
  </script>
  <style>
    :root{
      --bg-deep:#0d141b;
      --line:rgba(255,255,255,.10);
      --line-strong:rgba(255,255,255,.18);
      --accent:#0d5932;
      --gold:#dfbf79;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;overflow:hidden;
      font-family:Inter,"Microsoft JhengHei",Arial,sans-serif;
      color:var(--ink,#e8edf2);
      background:
        radial-gradient(900px 600px at 12% -8%, rgba(96,165,235,.22), transparent 60%),
        radial-gradient(700px 500px at 108% 12%, rgba(167,120,245,.16), transparent 55%),
        radial-gradient(800px 700px at 50% 118%, rgba(56,199,173,.14), transparent 60%),
        linear-gradient(160deg,#0d141b 0%,#111c26 50%,#0a1117 100%);
      background-attachment:fixed;
    }

    /* ---- React Bits: Aurora background ---- */
    .aurora-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
    .aurora-layer{
      position:absolute;inset:-45%;opacity:.55;
      mix-blend-mode:screen;filter:blur(70px);
      animation:aurora-drift var(--dur,28s) ease-in-out infinite alternate;
      animation-delay:var(--delay,0s);
    }
    .aurora-layer:nth-child(1){
      background:radial-gradient(42% 42% at 30% 34%, rgba(64,150,255,.55), transparent 70%);
    }
    .aurora-layer:nth-child(2){
      background:radial-gradient(38% 38% at 70% 24%, rgba(140,110,255,.48), transparent 70%);
    }
    .aurora-layer:nth-child(3){
      background:radial-gradient(44% 44% at 58% 72%, rgba(38,180,155,.40), transparent 70%);
    }
    @keyframes aurora-drift{
      0%{transform:translate3d(-4%,-2%,0) rotate(0deg) scale(1)}
      50%{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}
      100%{transform:translate3d(-2%,4%,0) rotate(-4deg) scale(1.02)}
    }

    /* ---- React Bits: DotField ---- */
    .dotfield-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.7}

    /* ---- Layout: glass card on the left, animated background fills the rest ---- */
    .login-root{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;padding:24px clamp(20px,6vw,96px)}

    .login-card{
      width:100%;max-width:430px;
      padding:44px 40px 30px;
      border-radius:20px;
      background:rgba(18,28,38,.55);
      -webkit-backdrop-filter:blur(20px) saturate(1.5);
      backdrop-filter:blur(20px) saturate(1.5);
      border:1px solid var(--line-strong);
      box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10);
      animation:fade-in .7s cubic-bezier(.22,.9,.3,1) both;
    }
    @keyframes fade-in{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

    .login-logo{display:flex;align-items:center;gap:14px;margin-bottom:34px}
    .login-logo-badge{
      width:48px;height:48px;border-radius:50%;
      display:grid;place-items:center;
      border:1px solid rgba(223,191,121,.6);
      color:var(--gold);font-size:19px;font-weight:800;letter-spacing:.02em;
      background:rgba(223,191,121,.08);
      box-shadow:0 0 0 6px rgba(223,191,121,.06), inset 0 0 14px rgba(223,191,121,.15);
      transition:transform .3s, box-shadow .3s;
    }
    .login-logo:hover .login-logo-badge{transform:rotate(-8deg) scale(1.06);box-shadow:0 0 0 8px rgba(223,191,121,.10), 0 8px 24px rgba(0,0,0,.35)}
    .login-logo-name{font-size:17px;font-weight:800;letter-spacing:.02em;color:#fff}
    .login-logo-name small{display:block;font-size:10px;font-weight:600;color:var(--muted,#8fa0b1);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}

    .login-card h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff}
    .login-card h1 span{color:var(--gold)}
    .login-sub{margin:0 0 28px;font-size:13px;line-height:1.7;color:var(--muted,#8fa0b1)}

    .login-field{display:grid;gap:7px;margin-bottom:16px;font-size:12px;font-weight:700;color:#b9c6d2}
    .login-field input{
      height:46px;border:1px solid var(--line-strong);border-radius:10px;
      background:rgba(10,17,24,.55);color:#e8edf2;padding:0 14px;
      font:inherit;font-size:14px;outline:none;
      transition:border-color .15s, box-shadow .15s, background .15s, transform .15s;
    }
    .login-field input::placeholder{color:#5f7182}
    .login-field input:hover{border-color:rgba(255,255,255,.28)}
    .login-field input:focus{border-color:#0d5932;box-shadow:0 0 0 3px rgba(13,89,50,.28);background:rgba(10,17,24,.75);transform:translateY(-1px)}

    .login-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 22px;font-size:12.5px}
    .login-remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;user-select:none}
    .login-remember input{width:15px;height:15px;accent-color:#0d5932;cursor:pointer}
    .login-forgot{color:#7fb0d8;text-decoration:none;font-weight:600;transition:color .15s}
    .login-forgot:hover{color:#a8d0ef;text-decoration:underline}

    .login-btn{
      width:100%;height:48px;border:0;border-radius:10px;
      background:linear-gradient(180deg,#0e6b3c 0%,#0a4a28 100%);
      color:#fff;font:inherit;font-size:14px;font-weight:800;letter-spacing:.04em;
      cursor:pointer;position:relative;
      box-shadow:0 8px 22px rgba(13,89,50,.35), inset 0 1px 0 rgba(255,255,255,.15);
      transition:transform .15s, box-shadow .18s, filter .15s;
    }
    .login-btn:hover{filter:brightness(1.10);transform:translateY(-1px);box-shadow:0 12px 28px rgba(13,89,50,.45)}
    .login-btn:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(13,89,50,.3)}
    .login-btn:disabled{cursor:progress;filter:brightness(.9);opacity:.85}
    .login-btn:disabled::after{
      content:"";position:absolute;right:14px;top:50%;width:16px;height:16px;
      margin-top:-8px;border-radius:50%;
      border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .login-hint{margin-top:16px;font-size:11px;color:#5f7182;text-align:center}
    .login-error{display:none;margin:16px 0 0;padding:10px 12px;border:1px solid rgba(255,120,120,.4);border-radius:9px;background:rgba(200,60,60,.14);color:#ffb4b4;font-size:12px;line-height:1.5;white-space:pre-wrap}
    .login-error.show{display:block}
    .login-version{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#5f7182;display:flex;align-items:center;justify-content:space-between}
    .login-version b{color:var(--muted);font-weight:700}

    @media(max-width:640px){
      .login-root{justify-content:center;padding:20px}
      .login-card{padding:36px 26px 24px}
    }
  </style>
</head>
<body>
  <!-- React Bits background (Aurora + DotField) and glass login card are rendered by React below -->
  <div id="root"></div>

  <script src="firebase.js"></script>
  <script src="auth.js"></script>
  <!-- React Bits components -->
  <script type="text/babel" src="components/reactbits/Aurora.jsx"></script>
  <script type="text/babel" src="components/reactbits/DotField.jsx"></script>
  <!-- Login UI (React Bits style) -->
  <script type="text/babel">
    function LoginApp() {
      return (
        <div className="login-root">
          <window.ReactBits.Aurora layers={3} speed={1} />
          <window.ReactBits.DotField density={520} size={1.6} speed={0.6} />
          <div className="login-card">
            <div className="login-logo">
              <span className="login-logo-badge">T1</span>
              <span className="login-logo-name">RFQ Itemizer<small>System Configuration Library</small></span>
            </div>
            <h1>Welcome <span>Back</span></h1>
            <p className="login-sub">Sign in to manage your RFQ projects, configuration pairs, and cloud-synced documents — all in one place.</p>

            <form id="loginForm" noValidate>
              <label className="login-field">Email
                <input type="email" name="email" placeholder="you@company.com" autoComplete="email" />
              </label>
              <label className="login-field">Password
                <input type="password" name="password" placeholder="••••••••" autoComplete="current-password" />
              </label>
              <div className="login-row">
                <label className="login-remember"><input type="checkbox" name="remember" /> Remember Me</label>
                <a href="#" className="login-forgot" id="forgotLink">Forgot Password?</a>
              </div>
              <button type="submit" className="login-btn" id="loginBtn">Login</button>
              <div className="login-hint">Forgot Password is displayed for reference only.</div>
            </form>
            <div className="login-error" id="loginError"></div>

            <div className="login-version"><span>RFQ Itemizer</span><b>Version 1.0</b></div>
          </div>
        </div>
      );
    }
    // Babel loads external .jsx (Aurora/DotField) asynchronously; retry until ready.
    function mountLogin() {
      if (window.ReactBits && window.ReactBits.Aurora && window.ReactBits.DotField) {
        ReactDOM.createRoot(document.getElementById('root')).render(<LoginApp />);
        return;
      }
      setTimeout(mountLogin, 60);
    }
    mountLogin();
  </script>
  <script>
    // Firebase Authentication（Modular v10，經 auth.js）
    // 登入成功 → 導向 index.html；失敗 → 顯示 Firebase error message。
    function showLoginError(msg) {
      var el = document.getElementById('loginError');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
    }

    // Firebase 錯誤碼 → 中文提示（便於判斷原因）
    var AUTH_ERROR_HINTS = {
      'auth/invalid-credential': 'Email 或密碼錯誤，請重新輸入',
      'auth/wrong-password': '密碼錯誤',
      'auth/user-not-found': '找不到此 Email 帳號',
      'auth/invalid-email': 'Email 格式不正確',
      'auth/operation-not-allowed': 'Firebase Console 尚未啟用 Email/Password 登入',
      'auth/too-many-requests': '嘗試次數過多，請稍後再試',
      'auth/network-request-failed': '網路連線失敗，請檢查網路'
    };

    function doLogin() {
      var btn = document.getElementById('loginBtn');
      var auth = (window.T1 || {}).auth;
      var email = document.querySelector('input[name="email"]').value.trim();
      var password = document.querySelector('input[name="password"]').value;

      if (!email || !password) { showLoginError('請輸入 Email 與 Password'); return; }

      console.log('Login Clicked');
      // Auth 模組未載入（SDK 不可用）：拒絕登入並提示（不直接放行）
      if (!auth || !auth.handleLogin) { showLoginError('認證服務暫時不可用（Firebase SDK 載入失敗），請重新整理後再試'); return; }

      if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
      auth.handleLogin(email, password).then(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Login'; }
        if (err) {
          // 解析 Firebase error code 並加上中文提示
          var code = (err.match(/\(([^)]+)\)/) || [])[1] || '';
          var hint = AUTH_ERROR_HINTS[code] || '';
          showLoginError(hint ? err + '\n' + hint : err);
        }
        // 成功時 handleLogin 已導向 index.html
      });
    }

    // React 渲染為異步（等待 ReactBits 元件載入），DOM 就緒後再綁定事件
    function bindLoginUI() {
      var form = document.getElementById('loginForm');
      var forgot = document.getElementById('forgotLink');
      if (!form || !forgot) { setTimeout(bindLoginUI, 60); return; }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        doLogin();
      });

      // Forgot Password — display only, no function (prevent navigation).
      forgot.addEventListener('click', function(e) {
        e.preventDefault();
      });
    }
    bindLoginUI();

    // 已登入狀態開啟 login.html → 自動導向主站
    // 依賴 onAuthStateChanged 回呼（session 恢復後的正確狀態），避免 currentUser() 恢復前誤判
    (function() {
      var auth = (window.T1 || {}).auth;
      if (!auth || !auth.init) return;
      auth.init();
      auth.onAuthChange(function(user) {
        if (auth.available && user && !user.isAnonymous) {
          console.log('[T1 Auth] 已登入，導向 index.html');
          window.location.replace('index.html');
        }
        // 匿名用戶（自動登入）留在登入頁，可選擇以 Email/Password 登入正式帳號
      });
    })();
  </script>
</body>
</html>
